[project]
name = "parallel-download"
version = "0.1.0"
description = "Parallel file downloader using asyncio and aiohttp"
authors = [
    { name = "devcomfort", email = "im@devcomfort.me" }
]
license = { file = "LICENSE" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: System :: Networking",
    "Typing :: Typed",
]
urls = { Homepage = "https://github.com/devcomfort/parallel-download", Repository = "https://github.com/devcomfort/parallel-download", Issues = "https://github.com/devcomfort/parallel-download/issues" }
dependencies = [
    "loguru>=0.7.3",
    "rich>=14.2.0",
    "pydantic>=2.12.5",
    "asyncio>=4.0.0",
    "aiohttp>=3.13.2",
    "aiofiles>=25.1.0",
    "tabulate>=0.9.0",
    "wcwidth>=0.2.14",
    "exceptiongroup>=1.3.1",
]
readme = "README.md"
requires-python = ">=3.8"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "mypy>=1.19.1",
    "tabulate>=0.9.0",
    "twine>=6.2.0",
    "ruff>=0.14.14",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/parallel_download"]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]  # Flake8 (E, W, F) + isort (I)
ignore = []

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false


[tool.coverage.run]
branch = true
source = ["src/parallel_download"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
    "raise ImportError",
]
fail_under = 80
show_missing = true
